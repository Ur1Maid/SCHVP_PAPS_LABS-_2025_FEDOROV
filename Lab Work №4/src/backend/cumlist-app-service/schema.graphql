schema {
  query: Query
  mutation: Mutation
}

type CumlistRejectDocumentPayload {
  long: Long
}

type CumlistSignDocumentPayload {
  long: Long
}

type Mutation {
  """
  Подписать накопительную ведомость
  
  **Returns:** Идентификатор накопительной ведомости
  """
  cumlistSignDocument("Описание подписи накопительной ведомости" input: CumlistSignDocumentInput!): CumlistSignDocumentPayload!
  """
  Отклонить накопительную ведомость
  
  **Returns:** Идентификатор накопительной ведомости
  """
  cumlistRejectDocument("Описание отклонение накопительной ведомости" input: CumlistRejectDocumentInput!): CumlistRejectDocumentPayload!
}

type Query {

}

"Отклонить документ накопительной ведомости"
input CumlistRejectDocumentInput {
  "Идентификатор причины отклонения"
  discordId: Int!
  "Текст причины отклонения"
  discordText: String
  "Идентификатор документа накопительной ведомости"
  docId: Long!
  "Идентификатор корреляции"
  correlationId: UUID!
}

"Подписать документ накопительной ведомости"
input CumlistSignDocumentInput {
  "Идентификатор документа накопительной ведомости"
  docId: Long!
  "Идентификатор корреляции"
  correlationId: UUID!
}

"Код ошибки операции с документом накопительной ведомости"
enum CumlistDocumentOperationErrorCode {
  "Документ не найден"
  NOT_FOUND
  "Операция не доступна"
  NOT_AVILABLE
  "Исключение в операции"
  EXCEPTION
}

"The `@specifiedBy` directive is used within the type system definition language to provide a URL for specifying the behavior of custom scalar definitions."
directive @specifiedBy("The specifiedBy URL points to a human-readable specification. This field will only read a result for scalar types." url: String!) on SCALAR

"The `Long` scalar type represents non-fractional signed whole 64-bit numeric values. Long can represent values between -(2^63) and 2^63 - 1."
scalar Long

scalar UUID @specifiedBy(url: "https:\/\/tools.ietf.org\/html\/rfc4122")
spec:
  inputs:
    stage:
      description: The stage in which the job will run
      default: build
    environment:
      default: $CI_COMMIT_BRANCH
      description: "The environment where application will be deployed"
    extra_args:
      description: Additional image build arguments
      default: ""
    nuget_config:
      description: Nuget.config file path
      default: ""
    ca_cert:
      description: Self-signed CA certificate name
      options: ["","nts-local"]
      default: ""
    kaniko_registry:
      description: Registry from which the Kaniko image will bi pulled
      default: registry.ntsmail.ru/gcr.io
    kaniko_version:
      description: Version of Kaniko image
      default: v1.23.2-debug
    registry:
      description: Registry where the built image will be pushed
      default: registry.ntsmail.ru
    registry_user:
      description: Registry user
    registry_password:
      description: Registry user's password
    docker_image:
      description: Name of the built image
      default: "${CI_PROJECT_NAME}"
    image_tag:
      description: Tag of the built image
      default: "${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_IID}"
    context:
      description: Docker image build context
      default: $CI_PROJECT_DIR/src
    verbosity:
      default: info
      description: Level of logging  
    dockerfile:
      default: ""
    build_arg:
      default: ""
---
.build-image:
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.kaniko_registry ]]/kaniko-project/executor:$[[ inputs.kaniko_version ]]
    entrypoint: [""]
  variables:
    BUILD_APP_ARG: $[[ inputs.build_arg ]]
    BUILD_APP_VERBOSITY: $[[ inputs.verbosity ]]
    BUILD_APP_ENVIRONMENT: $[[ inputs.environment ]]
    BUILD_APP_IMAGE_NAME: $[[ inputs.docker_image ]]
    BUILD_APP_IMAGE_TAG: $[[ inputs.image_tag ]]
    BUILD_APP_DOCKERFILE: $[[ inputs.dockerfile ]]
    BUILD_APP_CONTEXT: $[[ inputs.context ]]
    BUILD_APP_NUGET_CONFIG: $[[ inputs.nuget_config ]]
    BUILD_APP_REGISTRY: $[[ inputs.registry ]]
    BUILD_APP_REGISTRY_USER: $[[ inputs.registry_user ]]
    BUILD_APP_REGISTRY_PASSWORD: $[[ inputs.registry_password ]]
    BUILD_APP_CA_CERT: $[[ inputs.ca_cert ]]
  before_script:
     - BUILD_APP_IMAGE_NAME=$(echo "$BUILD_APP_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
     - if [ -z "${BUILD_APP_DOCKERFILE}" ]; then BUILD_APP_DOCKERFILE="${BUILD_APP_CONTEXT}/Dockerfile"; fi
     - echo "${BUILD_APP_DOCKERFILE}"
     - if [ ! -z "${BUILD_APP_NUGET_CONFIG}" ]; then cat "${BUILD_APP_NUGET_CONFIG}" > "${CI_PROJECT_DIR}/src/nuget.config"; fi
     - mkdir -p /kaniko/.docker
     - echo "{\"auths\":{\"${BUILD_APP_REGISTRY}\":{\"auth\":\"$(echo -n ${BUILD_APP_REGISTRY_USER}:${BUILD_APP_REGISTRY_PASSWORD} | base64 )\"}}}" > /kaniko/.docker/config.json   
     - | 

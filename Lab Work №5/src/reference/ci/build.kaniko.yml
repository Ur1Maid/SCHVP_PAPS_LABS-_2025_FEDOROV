       - /kaniko/executor
        --context "${BUILD_APP_CONTEXT}"
        --dockerfile "${BUILD_APP_DOCKERFILE}"
        --destination "${BUILD_APP_REGISTRY}/${BUILD_APP_IMAGE_NAME}:${BUILD_APP_IMAGE_TAG}"
        --destination "${BUILD_APP_REGISTRY}/${BUILD_APP_IMAGE_NAME}:${BUILD_APP_ENVIRONMENT}"

spec:
  inputs:
    project_group:
    source_dir:
    env:
      default: $CI_COMMIT_BRANCH
    deployment_folder:
      default: deploy
    nuget_config:
      description: Nuget.config file path
      default: ""  
    tags:
      type: array
      default:
        - docker-executor  

---

include:
  - component: ${CI_SERVER_FQDN}/as-transport-task-nts/devops/ci/build/kaniko@main
    inputs:
      environment: $[[ inputs.env ]]
      registry_user: ${NTS_REGISTRY_USER}
      registry_password: ${NTS_REGISTRY_PASSWORD}
      dockerfile: ${CI_PROJECT_DIR}/src/$[[ inputs.source_dir ]]/Dockerfile
      docker_image: $[[ inputs.project_group ]]/${CI_PROJECT_NAME}
      nuget_config: $[[ inputs.nuget_config ]]

  - component: ${CI_SERVER_FQDN}/as-transport-task-nts/devops/ci/creating-manifests/manifests@main
    inputs:
      environment: $[[ inputs.env ]]
      deployment_root: $[[ inputs.deployment_folder ]]
      service_namespace: $[[ inputs.project_group ]]
  
  - component: ${CI_SERVER_FQDN}/as-transport-task-nts/devops/ci/push-manifests/manifests@main
    inputs:
      service_namespace: $[[ inputs.project_group ]]
      environment:  $[[ inputs.env ]]
      environment_url:  $[[ inputs.env ]].nts.local
      registry_user: ${NTS_REGISTRY_USER}
      registry_password: ${NTS_REGISTRY_PASSWORD}


.deploy-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "test"
    - if: $CI_COMMIT_BRANCH == "prod"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  tags: $[[ inputs.tags ]]

build-image:
  extends: .build-image
  rules:
    !reference [.deploy-rules, rules]
render-manifest:
  extends: .render-manifests
  rules:
    !reference [.deploy-rules, rules]
push-manifests:
  extends: .push-manifests
  rules:
   !reference [.deploy-rules, rules]

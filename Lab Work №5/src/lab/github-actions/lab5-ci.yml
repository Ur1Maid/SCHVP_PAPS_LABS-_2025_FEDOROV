name: lab5-ci

on:
  workflow_dispatch:
  push:
    branches: [ "LabWork5", "main" ]
    paths:
      - "Lab Work №5/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Lab Work №5/**"

jobs:
  validate-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab Work №5/src/lab
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose syntax
        run: docker compose -f docker-compose.lab5.yml config > /tmp/docker-compose.rendered.yml

      - name: Upload rendered compose
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-rendered
          path: /tmp/docker-compose.rendered.yml

  smoke-tests:
    runs-on: ubuntu-latest
    needs: validate-config
    defaults:
      run:
        working-directory: Lab Work №5/src/lab/tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install

      - name: Run collection against default local URLs
        run: npx newman run "CumList Smoke Tests.postman_collection.json" -e "CumList Smoke Tests.postman_environment.json"

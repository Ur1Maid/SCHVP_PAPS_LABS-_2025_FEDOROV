name: lab5-cd

on:
  workflow_dispatch:

jobs:
  publish-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx setup
        uses: docker/setup-buildx-action@v3

      - name: Note
        run: |
          echo "Этот workflow является шаблоном для публикации образов."
          echo "Его следует переносить в репозиторий со служебным кодом либо в агрегирующий mono-repo."
          echo "Внутри лабораторного репозитория отсутствуют сами сервисы, поэтому шаги build/push оставлены как проектный шаблон."

services:
  frontend:
    image: automatic-dispatch-frontend:lab
    container_name: automatic-dispatch-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      data-service:
        condition: service_healthy
      app-service:
        condition: service_healthy
    networks:
      - nts-core-network

  data-service:
    image: cumlist-data-service:lab
    container_name: cumlist-data-service
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Database__Server: shared-db
      Database__Port: 5432
      Database__Database: etran_auto_normalized_docs
      Database__Username: ${POSTGRES_USER}
      Database__Password: ${POSTGRES_PASSWORD}
    ports:
      - "${DATA_SERVICE_PORT:-5178}:80"
    depends_on:
      shared-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --tries=1 --no-verbose http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nts-core-network

  app-service:
    image: cumlist-app-service:lab
    container_name: cumlist-app-service
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Database__Server: shared-db
      Database__Port: 5432
      Database__Database: etran_auto_normalized_docs
      Database__Username: ${POSTGRES_USER}
      Database__Password: ${POSTGRES_PASSWORD}
      Kafka__BootstrapServers: broker:9092
      Kafka__SchemaRegistryUrl: http://schema-registry:8081
      Redis__Endpoint: redis-cache:6379
    ports:
      - "${APP_SERVICE_PORT:-5179}:80"
    depends_on:
      shared-db:
        condition: service_healthy
      broker:
        condition: service_started
      schema-registry:
        condition: service_started
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --tries=1 --no-verbose http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nts-core-network

  normalize-service:
    image: cumlist-normalize-service:lab
    container_name: cumlist-normalize-service
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Database__Server: shared-db
      Database__Port: 5432
      Database__Database: etran_auto_normalized_docs
      Database__Username: ${POSTGRES_USER}
      Database__Password: ${POSTGRES_PASSWORD}
      Kafka__BootstrapServers: broker:9092
      Kafka__SchemaRegistryUrl: http://schema-registry:8081
      GraphQL__Client__Url: ${DATA_SERVICE_PUBLIC_URL:-http://data-service/}
      GraphQL__Client__Username: ${GRAPHQL_USER:-demo}
      GraphQL__Client__Password: ${GRAPHQL_PASSWORD:-demo}
    ports:
      - "${NORMALIZE_SERVICE_PORT:-5177}:80"
    depends_on:
      shared-db:
        condition: service_healthy
      broker:
        condition: service_started
      schema-registry:
        condition: service_started
      data-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --tries=1 --no-verbose http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nts-core-network

  shared-db:
    image: postgres:16-alpine
    container_name: shared-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etran_auto_normalized_docs}
      POSTGRES_USER: ${POSTGRES_USER:-cumlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cumlist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cumlist} -d ${POSTGRES_DB:-etran_auto_normalized_docs}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nts-core-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - nts-core-network

  broker:
    image: confluentinc/cp-kafka:7.6.1
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - nts-core-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - nts-core-network

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nts-core-network

volumes:
  postgres-data:
  redis-data:

networks:
  nts-core-network:
    driver: bridge
